<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>失敗（一般）淺色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#00796B}a:hover{color:#005B50}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; padding: 16px 20px 32px; background: #F6FAF9; color: #17201F; font-family: system-ui, -apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <div style="font-size: 24px; line-height: 32px; font-weight: 600">StepSim</div>
    <div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: #D5F0EC; color: #00201C; font-size: 14px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00201C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"></circle></svg>
      <span>模擬資料</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0">
    <div style="position: relative; width: 240px; height: 240px">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="進度 61%，已存入 3,050 步，目標 5,000 步，需要處理">
        <circle cx="120" cy="120" r="112" fill="none" stroke="#E3E9E7" stroke-width="16"></circle>
        <circle cx="120" cy="120" r="112" fill="none" stroke="#6F7977" stroke-width="16" stroke-linecap="round" stroke-dasharray="429.27 703.72" transform="rotate(-90 120 120)"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-size: 56px; line-height: 64px; font-weight: 600; font-variant-numeric: tabular-nums">3,050</div>
        <div style="font-size: 16px; color: #3F4947">步 · 61%</div>
      </div>
    </div>
    <div style="font-size: 18px; line-height: 24px; font-weight: 500">目標 5,000 步 · 走路</div>
  </div>

  <div role="alert" style="background: #F9DEDC; color: #410E0B; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 10px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#410E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3.5L2.8 19.5h18.4z"></path><path d="M12 10v4.5M12 17.2v.01"></path></svg>
      <div style="display: flex; flex-direction: column">
        <div style="font-size: 14px; font-weight: 600">需要處理</div>
        <div style="font-size: 18px; line-height: 24px; font-weight: 600">步數沒有存進去</div>
      </div>
    </div>
    <div style="font-size: 16px; line-height: 24px">發生了一點問題，請稍後按「重試」。已經存入的步數會保留。</div>
    <button style="height: 56px; border: 0; border-radius: 28px; background: #B3261E; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"></path></svg>重試
    </button>
    <div style="border-top: 1px solid #E8B7B3">
      <button aria-expanded="true" style="width: 100%; min-height: 48px; padding: 0; border: 0; background: transparent; color: #410E0B; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: space-between">
        <span>詳細資訊</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#410E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <div style="font-size: 16px; line-height: 22px; font-family: ui-monospace, 'Roboto Mono', monospace; word-break: break-all">第 31 批 · IllegalStateException: [錯誤訊息]</div>
    </div>
  </div>

  <button style="height: 48px; border: 0; border-radius: 24px; background: transparent; color: #00796B; font: inherit; font-size: 16px; font-weight: 600">結束本次模擬</button>

  <div style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 18px; line-height: 24px; font-weight: 600">使用小提醒</div>
    <div style="display: flex; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
      <div style="font-size: 16px; line-height: 24px">離開時請按 Home 鍵，不要從「最近使用」把 StepSim 滑掉，否則模擬會中斷。</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
    <div style="font-size: 16px; line-height: 24px; color: #3F4947">這些是依你設定模擬出來的步數，以「手動輸入」存入 Health Connect，不是感測器偵測到的真實步數。</div>
    <a href="#guide" style="display: inline-flex; align-items: center; min-height: 48px; font-size: 16px; font-weight: 600">使用說明與注意事項</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
