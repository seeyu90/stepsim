<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>準備（已設定）淺色</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#00796B}a:hover{color:#005B50}
</style>
</helmet>
<div style="width: 390px; height: 1240px; box-sizing: border-box; padding: 16px 20px 32px; background: #F6FAF9; color: #17201F; font-family: system-ui, -apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 56px">
    <div style="font-size: 24px; line-height: 32px; font-weight: 600">StepSim</div>
    <div style="display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 16px; background: #D5F0EC; color: #00201C; font-size: 14px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00201C" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3"></circle></svg>
      <span>模擬資料</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 8px 0">
    <div style="position: relative; width: 240px; height: 240px">
      <svg width="240" height="240" viewBox="0 0 240 240" role="img" aria-label="進度 0%，已存入 0 步，目標 5,000 步">
        <circle cx="120" cy="120" r="112" fill="none" stroke="#D5F0EC" stroke-width="16"></circle>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
        <div style="font-size: 56px; line-height: 64px; font-weight: 600; font-variant-numeric: tabular-nums">0</div>
        <div style="font-size: 16px; color: #3F4947">步</div>
      </div>
    </div>
    <div style="font-size: 18px; line-height: 24px; font-weight: 500">目標 5,000 步 · 走路</div>
    <div style="font-size: 16px; line-height: 22px; color: #3F4947; text-align: center">預計約需 50 分鐘，步數會依真實時間慢慢累積</div>
  </div>

  <div style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; flex-direction: column; gap: 8px">
      <label for="goal" style="font-size: 18px; line-height: 24px; font-weight: 600">目標步數</label>
      <div style="display: flex; align-items: center; height: 56px; padding: 0 16px; border: 2px solid #00796B; border-radius: 12px; box-sizing: border-box">
        <input id="goal" value="5000" inputmode="numeric" style="flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: inherit; font-size: 18px; color: #17201F; font-variant-numeric: tabular-nums">
        <span style="font-size: 16px; color: #3F4947">步</span>
      </div>
      <div style="font-size: 16px; color: #3F4947">輸入 1 到 100,000</div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <button style="height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid #6F7977; background: #FFFFFF; color: #17201F; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">1,000</button>
        <button aria-pressed="true" style="height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid #00796B; background: #D5F0EC; color: #00201C; font: inherit; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#00201C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg>5,000</button>
        <button style="height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid #6F7977; background: #FFFFFF; color: #17201F; font: inherit; font-size: 16px; font-variant-numeric: tabular-nums">10,000</button>
      </div>
    </div>

    <div style="height: 1px; background: #DCE5E3"></div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="font-size: 18px; line-height: 24px; font-weight: 600">速度</div>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 12px; border: 2px solid #00796B; background: #D5F0EC; color: #00201C; box-sizing: border-box">
        <input type="radio" name="speed" checked style="width: 20px; height: 20px; accent-color: #00796B; margin: 0">
        <span style="font-size: 16px; font-weight: 600">走路（約每分鐘 100 步）</span>
      </label>
      <label style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-radius: 12px; border: 1px solid #6F7977; background: #FFFFFF; color: #17201F; box-sizing: border-box">
        <input type="radio" name="speed" style="width: 20px; height: 20px; accent-color: #00796B; margin: 0">
        <span style="font-size: 16px">跑步（約每分鐘 160 步）</span>
      </label>
    </div>
  </div>

  <button style="height: 56px; border: 0; border-radius: 28px; background: #00796B; color: #FFFFFF; font: inherit; font-size: 16px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>開始模擬
  </button>

  <div style="background: #FFFFFF; border: 1px solid #DCE5E3; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="font-size: 18px; line-height: 24px; font-weight: 600">使用小提醒</div>
    <div style="display: flex; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
      <div style="font-size: 16px; line-height: 24px">離開時請按 Home 鍵，不要從「最近使用」把 StepSim 滑掉，否則模擬會中斷。</div>
    </div>
    <div style="display: flex; gap: 12px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00796B" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex: none; margin-top: 1px"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg>
      <div style="font-size: 16px; line-height: 24px">離開後會在背景繼續，可以從通知列暫停或結束。</div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
    <div style="font-size: 16px; line-height: 24px; color: #3F4947">這些是依你設定模擬出來的步數，以「手動輸入」存入 Health Connect，不是感測器偵測到的真實步數。</div>
    <a href="#guide" style="display: inline-flex; align-items: center; min-height: 48px; font-size: 16px; font-weight: 600">使用說明與注意事項</a>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1240}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
