<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>StepSim App icon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#00796B}a:hover{color:#005B50}
</style>
</helmet>
<div style="width: 1280px; height: 600px; box-sizing: border-box; padding: 56px; background: #F6FAF9; color: #17201F; font-family: system-ui, -apple-system, 'Noto Sans TC', 'PingFang TC', sans-serif; display: grid; grid-template-columns: 300px 1fr; gap: 56px">

  <div style="display: flex; flex-direction: column; gap: 20px">
    <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: #3F4947">標準（Adaptive icon）</div>
    <svg width="260" height="260" viewBox="0 0 108 108" role="img" aria-label="StepSim 圖示：開口進度環與兩個腳印" style="border-radius: 50%; box-shadow: 0 6px 24px rgba(0,60,52,0.18)">
      <rect width="108" height="108" fill="#00796B"></rect>
      <circle cx="54" cy="54" r="25" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
      <g fill="#FFFFFF" transform="rotate(-15 54 54)">
        <ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse>
        <ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse>
        <ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse>
        <ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse>
      </g>
    </svg>
    <div style="font-size: 16px; line-height: 24px; color: #3F4947">背景 #00796B，前景白色。圓環開口在右上，代表「還在進行中」；圓環也呼應主畫面的大圓環。</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 40px">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: #3F4947">各家桌面遮罩</div>
        <div style="display: flex; gap: 16px; align-items: center">
          <svg width="72" height="72" viewBox="0 0 108 108" role="img" aria-label="圓形遮罩" style="border-radius: 50%">
            <rect width="108" height="108" fill="#00796B"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
          <svg width="72" height="72" viewBox="0 0 108 108" role="img" aria-label="圓角方形遮罩" style="border-radius: 22px">
            <rect width="108" height="108" fill="#00796B"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
          <svg width="72" height="72" viewBox="0 0 108 108" role="img" aria-label="方形遮罩" style="border-radius: 10px">
            <rect width="108" height="108" fill="#00796B"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: #3F4947">主題化圖示（Android 13+，系統取色示意）</div>
        <div style="display: flex; gap: 16px; align-items: center">
          <svg width="72" height="72" viewBox="0 0 108 108" role="img" aria-label="主題化圖示，淺色系統主題" style="border-radius: 50%">
            <rect width="108" height="108" fill="#DDE6F7"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#1B2A44" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#1B2A44" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
          <svg width="72" height="72" viewBox="0 0 108 108" role="img" aria-label="主題化圖示，深色系統主題" style="border-radius: 50%">
            <rect width="108" height="108" fill="#2E3A2C"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#D3E8C8" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#D3E8C8" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: #3F4947">通知小圖示（只留腳印）</div>
        <div style="display: flex; gap: 16px; align-items: center">
          <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 20px; background: #1C2321; color: #E0E8E6; font-size: 14px">
            <svg width="20" height="20" viewBox="38 34 32 40" aria-hidden="true">
              <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
            </svg>
            <span>14:32</span>
          </div>
          <svg width="72" height="72" viewBox="30 26 48 56" role="img" aria-label="通知小圖示放大" style="background: #1C2321; border-radius: 12px">
            <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 16px">
      <div style="font-size: 14px; font-weight: 600; letter-spacing: 0.04em; color: #3F4947">橫式標誌（使用說明頁頁首、未來的商店頁）</div>
      <div style="display: flex; gap: 48px; align-items: center">
        <div style="display: flex; align-items: center; gap: 16px; padding: 24px 32px; background: #FFFFFF; border-radius: 16px; border: 1px solid #DCE5E3">
          <svg width="64" height="64" viewBox="0 0 108 108" aria-hidden="true" style="border-radius: 50%">
            <rect width="108" height="108" fill="#00796B"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#FFFFFF" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em; color: #17201F">StepSim</div>
            <div style="font-size: 16px; color: #3F4947">步數模擬</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 16px; padding: 24px 32px; background: #161D1C; border-radius: 16px">
          <svg width="64" height="64" viewBox="0 0 108 108" aria-hidden="true" style="border-radius: 50%">
            <rect width="108" height="108" fill="#4DB6AC"></rect>
            <circle cx="54" cy="54" r="25" fill="none" stroke="#00201C" stroke-width="5.5" stroke-linecap="round" stroke-dasharray="130.9 157.08"></circle>
            <g fill="#00201C" transform="rotate(-15 54 54)"><ellipse cx="47" cy="57" rx="4.6" ry="7.2"></ellipse><ellipse cx="47" cy="68.5" rx="3.4" ry="3.6"></ellipse><ellipse cx="61" cy="43" rx="4.6" ry="7.2"></ellipse><ellipse cx="61" cy="54.5" rx="3.4" ry="3.6"></ellipse></g>
          </svg>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <div style="font-size: 36px; font-weight: 600; letter-spacing: -0.01em; color: #E0E8E6">StepSim</div>
            <div style="font-size: 16px; color: #BEC9C6">步數模擬</div>
          </div>
        </div>
        <div style="display: flex; gap: 12px; align-items: center">
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #00796B"></div>
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #D5F0EC; border: 1px solid #DCE5E3"></div>
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #4DB6AC"></div>
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #17201F"></div>
          <div style="width: 48px; height: 48px; border-radius: 12px; background: #F6FAF9; border: 1px solid #DCE5E3"></div>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
